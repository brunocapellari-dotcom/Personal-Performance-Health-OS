name: codeql
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, final-production-architecture]
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build_mode: none
          - language: java-kotlin
            build_mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.1'
      - name: Install Android SDK 37
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build Android for CodeQL
        if: matrix.language == 'java-kotlin'
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
